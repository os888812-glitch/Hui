[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-telegram-clone"
version = "0.1.0"
requires-python = ">=3.11"
description = "Telegram bot clone for SoundCloud search with HeartBalloons start sticker."

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
